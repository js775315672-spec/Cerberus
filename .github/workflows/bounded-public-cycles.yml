name: Bounded public cycle batches
on:
  push:
    branches: [research/bounded-cycle-batches]
    paths: ['.github/workflows/bounded-public-cycles.yml']
permissions:
  contents: write
jobs:
  batch_1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 'f0f93c0a26c8445e3973847b4b58c76bce570338'
          path: target
          persist-credentials: false
      - name: Start local CPU inference
        run: |
          set -eu
          docker run -d --name ofc-model -p 127.0.0.1:11434:11434 ollama/ollama:0.13.5
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags; then break; fi
            sleep 2
          done
          docker exec ofc-model ollama pull qwen2.5:0.5b
      - name: Measure and commit each public cycle separately
        env:
          COUNT: '1'
          SOURCE: 'bdc1589516f0348e23efe0a61d3cac163ce5be29'
        run: python agent/bounded_public_cycles.py
  batch_3:
    needs: batch_1
